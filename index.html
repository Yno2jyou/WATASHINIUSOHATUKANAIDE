<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>私に嘘はつかないで</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap');

    :root {
      --bg: #1a1a2e;
      --card: #16213e;
      --accent: #e94560;
      --gold: #f0c040;
      --text: #eaeaea;
      --muted: #a0a0b0;
      --success: #2ecc71;
      --danger: #e74c3c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background: linear-gradient(160deg, #1a1a2e 0%, #0f0f1a 50%, #1a1a2e 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
    }

    .game-container {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
      overflow: hidden;
      position: relative;
    }

    header {
      background: linear-gradient(135deg, #e94560, #c23a51);
      padding: 20px 24px;
      text-align: center;
      position: relative;
    }

    .btn-top {
      position: absolute;
      top: 50%;
      right: 14px;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.25);
      color: #fff;
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      letter-spacing: 0.04em;
      display: none;
      transition: background 0.15s, transform 0.15s;
      z-index: 5;
    }
    .btn-top:active {
      transform: translateY(-50%) scale(0.95);
    }
    .btn-top.show {
      display: inline-block;
    }
    .btn-top:hover {
      background: rgba(0,0,0,0.4);
    }
    .btn-mute {
      position: absolute;
      top: 50%;
      left: 12px;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.25);
      color: #fff;
      font-family: inherit;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      min-width: 40px;
      height: 28px;
      border-radius: 14px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      z-index: 5;
      padding: 0 8px;
      line-height: 1;
    }
    .btn-mute.show { display: flex; }
    .btn-mute:active { transform: translateY(-50%) scale(0.95); }
    .btn-mute:hover { background: rgba(0,0,0,0.4); }


    header h1 {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    header .subtitle {
      font-size: 0.75rem;
      opacity: 0.85;
      margin-top: 4px;
    }

    .score-bar {
      display: flex;
      justify-content: space-between;
      padding: 12px 20px;
      background: rgba(0,0,0,0.25);
      font-size: 0.9rem;
      font-weight: 700;
    }

    .score-bar .player {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .score-bar .label {
      font-size: 0.7rem;
      color: var(--muted);
      font-weight: 400;
    }

    .score-bar .active {
      color: var(--gold);
    }

    .main {
      padding: 24px 20px 28px;
      min-height: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .screen {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      animation: fadeIn 0.35s ease;
    }

    .screen.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .instruction {
      text-align: center;
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--muted);
    }

    .instruction strong {
      color: var(--gold);
    }

    .role-badge {
      display: inline-block;
      background: rgba(233,69,96,0.2);
      color: var(--accent);
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    textarea, input[type="text"] {
      width: 100%;
      background: rgba(0,0,0,0.35);
      border: 2px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 14px 16px;
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus, input[type="text"]:focus {
      border-color: var(--accent);
    }

    textarea {
      min-height: 100px;
    }

    .truth-toggle {
      display: flex;
      width: 100%;
      gap: 10px;
      margin-top: 4px;
    }

    .truth-toggle button {
      flex: 1;
      padding: 12px;
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      background: rgba(0,0,0,0.25);
      color: var(--muted);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .truth-toggle button.selected-truth {
      border-color: var(--success);
      background: rgba(46,204,113,0.15);
      color: var(--success);
    }

    .truth-toggle button.selected-lie {
      border-color: var(--danger);
      background: rgba(231,76,60,0.15);
      color: var(--danger);
    }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      letter-spacing: 0.03em;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: linear-gradient(135deg, #e94560, #c23a51);
      color: white;
      box-shadow: 0 6px 20px rgba(233,69,96,0.4);
    }

    .btn-primary:hover {
      box-shadow: 0 8px 28px rgba(233,69,96,0.55);
    }

    .btn-gold {
      background: linear-gradient(135deg, #f0c040, #d4a017);
      color: #1a1a2e;
      box-shadow: 0 6px 20px rgba(240,192,64,0.4);
    }

    .btn-lie {
      background: linear-gradient(135deg, #e94560, #a83248);
      color: white;
      box-shadow: 0 6px 20px rgba(233,69,96,0.4);
    }

    .decision-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      margin-top: 8px;
    }

    .statement-display {
      background: rgba(0,0,0,0.35);
      border-radius: 16px;
      padding: 20px 18px;
      width: 100%;
      text-align: center;
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.45;
      border: 1px solid rgba(255,255,255,0.06);
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Animation overlay */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(8,8,16,0.97);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      border-radius: 24px;
      /* Prevent iOS from treating the whole overlay as a media surface */
      -webkit-overflow-scrolling: touch;
    }

    .overlay.active {
      display: flex;
      animation: fadeIn 0.25s ease;
    }

    .anim-area {
      width: 100%;
      padding: 0 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      /* Keep video constrained inside the card so native FS is less likely */
      max-height: 70vh;
    }

    .stage {
      position: relative;
      width: 100%;
      line-height: 0; /* remove inline-gap under video */
    }

    .anim-area video {
      width: 100%;
      max-height: min(55vh, 420px);
      object-fit: contain;
      display: none;
      border-radius: 14px;
      background: #090911; /* 編集したムービーの余白色と同じ(境目が見えない) */
      /* iOS / Android: keep playback inline, never jump to native fullscreen player */
      -webkit-playsinline: true;
    }

    .anim-area video.show {
      display: block;
    }

    /* Mobile: give the movie a bit more vertical room so it feels less cramped */
    @media (max-width: 480px) {
      .anim-area video {
        max-height: 58vh;
      }
      .countdown {
        font-size: 3.2rem;
      }
    }

    /* 数字はムービーの下(余白帯)に出す */
    .countdown {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 22%;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 3.6rem;
      font-weight: 800;
      line-height: 1;
      color: var(--gold);
      text-shadow: 0 6px 30px rgba(240,192,64,0.5);
      pointer-events: none;
    }

    .countdown.show {
      display: flex;
    }

    .countdown.pop {
      animation: cdPop 0.85s ease-out;
    }

    @keyframes cdPop {
      0% { transform: scale(1.9); opacity: 0; }
      30% { transform: scale(1); opacity: 1; }
      100% { transform: scale(0.85); opacity: 0.35; }
    }

    .result-text {
      margin-top: 16px;
      font-size: 1.3rem;
      font-weight: 800;
      text-align: center;
    }

    .result-text.correct {
      color: var(--success);
    }

    .result-text.wrong {
      color: var(--danger);
    }

    .result-sub {
      font-size: 0.9rem;
      color: var(--muted);
      margin-top: 6px;
      text-align: center;
    }

    .result-img-wrap {
      display: none;
      width: 72%;
      max-width: 260px;
      margin: 0 auto;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 32px rgba(0,0,0,0.5);
      border: 2px solid rgba(255,255,255,0.1);
      flex-shrink: 0;
    }
    .result-img-wrap.show {
      display: block;
      animation: fadeIn 0.35s ease;
    }
    .result-img-wrap img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }
    /* 結果表示中は動画エリアを隠し、画像を中央に */
    .overlay.result-mode .anim-area {
      display: none;
    }
    .overlay.result-mode .result-text {
      margin-top: 0;
      margin-bottom: 14px;
    }
    .overlay.result-mode .result-sub {
      margin-top: 12px;
    }
    .overlay.result-mode .btn-continue {
      margin-top: 18px;
    }


    .btn-continue {
      margin-top: 20px;
      width: 80%;
    }

    /* Start screen */
    .title-big {
      font-size: 1.6rem;
      font-weight: 800;
      text-align: center;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .start-desc {
      text-align: center;
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 8px;
    }

    .name-inputs {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .name-inputs label {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .footer-note {
      text-align: center;
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 12px;
      opacity: 0.7;
    }

    /* Pass device prompt */
    .pass-prompt {
      background: rgba(240,192,64,0.12);
      border: 1px solid rgba(240,192,64,0.3);
      border-radius: 14px;
      padding: 16px;
      text-align: center;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .pass-prompt strong {
      color: var(--gold);
    }

    /* Hidden truth indicator (for debugging, normally hidden) */
    .secret {
      display: none;
    }
  </style>
</head>
<body>
  <div class="game-container" id="game">
    <header>
      <h1>私に嘘はつかないで</h1>
      <div class="subtitle">嘘か本当か、見抜け！</div>
      <button type="button" class="btn-mute" id="btnMute" onclick="toggleBgm()" aria-label="BGM">BGM</button>
      <button type="button" class="btn-top" id="btnTop" onclick="goToTop()">TOP</button>
    </header>
    <audio id="bgm" loop preload="auto" playsinline></audio>

    <div class="score-bar" id="scoreBar" style="display:none;">
      <div class="player" id="p1Score">
        <span class="label" id="p1Label">プレイヤー1</span>
        <span id="p1Points">0</span>
      </div>
      <div class="player">
        <span class="label">連続正解</span>
        <span id="streak">0</span>
      </div>
      <div class="player" id="p2Score">
        <span class="label" id="p2Label">プレイヤー2</span>
        <span id="p2Points">0</span>
      </div>
    </div>

    <div class="main">
      <!-- START SCREEN -->
      <div class="screen active" id="screen-start">
        <div class="title-big">『私に嘘はつかないで』</div>
        <p class="start-desc">
          片方が「嘘か本当かわからないこと」を入力。<br>
          もう片方が見抜く！<br>
          正解で連続ターン、間違えたら交代。
        </p>
        <div class="name-inputs">
          <div>
            <label>プレイヤー1の名前</label>
            <input type="text" id="name1" placeholder="例：太郎" maxlength="10" value="プレイヤー1">
          </div>
          <div>
            <label>プレイヤー2の名前</label>
            <input type="text" id="name2" placeholder="例：花子" maxlength="10" value="プレイヤー2">
          </div>
        </div>
        <button class="btn btn-primary" onclick="startGame()">ゲーム開始</button>
        <p class="footer-note">同じ端末を交互に渡して遊んでね</p>
      </div>

      <!-- PASS DEVICE (after start / after switch) -->
      <div class="screen" id="screen-pass">
        <div class="pass-prompt">
          <strong id="passToName">○○</strong> さんに<br>端末を渡してください
        </div>
        <p class="instruction" id="passRoleText">あなたは「発言者」です</p>
        <button class="btn btn-primary" onclick="confirmPass()">受け取った！</button>
      </div>

      <!-- INPUT STATEMENT -->
      <div class="screen" id="screen-input">
        <div class="role-badge">発言者</div>
        <p class="instruction"><strong id="inputPlayerName">あなた</strong> の番です。<br>嘘か本当かわからないことを入力してね</p>
        <textarea id="statementInput" placeholder="例：昨日、猫が空を飛んだのを見た" maxlength="80"></textarea>
        <p class="instruction" style="font-size:0.85rem; margin-top:4px;">これは…</p>
        <div class="truth-toggle">
          <button type="button" id="btnTruth" onclick="setTruth(true)">本当</button>
          <button type="button" id="btnLie" onclick="setTruth(false)">嘘</button>
        </div>
        <button class="btn btn-primary" id="btnSend" onclick="sendStatement()" disabled>送信する</button>
      </div>

      <!-- PASS TO GUESSER -->
      <div class="screen" id="screen-pass-guesser">
        <div class="pass-prompt">
          端末を <strong id="passGuesserName">○○</strong> さんに<br>渡してください
        </div>
        <p class="instruction">発言が送信されました。<br>見抜く番の人に渡してね！</p>
        <button class="btn btn-primary" onclick="showGuessScreen()">受け取った！</button>
      </div>

      <!-- GUESS SCREEN -->
      <div class="screen" id="screen-guess">
        <div class="role-badge">見抜く人</div>
        <p class="instruction"><strong id="guesserName">あなた</strong> の番です。<br>これは嘘？ 本当？</p>
        <div class="statement-display" id="statementDisplay">……</div>
        <div class="decision-buttons">
          <button class="btn btn-lie" onclick="makeGuess(false)">嘘</button>
          <button class="btn btn-gold" onclick="makeGuess(true)">本当</button>
        </div>
      </div>

      <!-- RESULT / ANIMATION handled by overlay -->
    </div>

    <!-- Animation Overlay -->
    <div class="overlay" id="overlay">
      <div class="anim-area" id="animArea">
        <div class="stage">
          <video id="mv"
            playsinline
            webkit-playsinline
            x5-playsinline
            x5-video-player-type="h5"
            x5-video-player-fullscreen="false"
            preload="auto"
            disablePictureInPicture
            controlsList="nodownload nofullscreen noremoteplayback"
            style="-webkit-playsinline:true;"></video>
          <div class="countdown" id="countdown"></div>
        </div>
      </div>
      <div class="result-text" id="resultText"></div>
      <div class="result-img-wrap" id="resultImgWrap">
        <img id="resultImg" alt="" />
      </div>
      <div class="result-sub" id="resultSub"></div>
      <button class="btn btn-primary btn-continue" id="btnNext" onclick="afterResult()">次へ</button>
    </div>
  </div>

  <script>
    // ===== Result videos (embedded, H.264/MP4) =====
    // intro: 冒頭(選択画面の前)
    // kinuso : 『金だ！』→『私に嘘はつけないでー』を1本に編集(つなぎ目は0.25秒のクロスフェード)
    // kinkan : 『金だ！』→『勘違いするなよ』を1本に編集(つなぎ目は0.25秒のクロスフェード)
    // join   : 『金だ！』パートが終わって次のムービーに切り替わる時刻(秒)。カウントダウンはこの3秒前から
    const VIDEO_FILES = {
      intro:  'intro.mp4',
      kinuso: 'kinuso.mp4',
      kinkan: 'kinkan.mp4'
    };
    const SEQ = {
      uso:       { key: 'kinuso', join: 11.683 },
      kanchigai: { key: 'kinkan', join: 11.483 }
    };
    function videoUrl(key) {
      return VIDEO_FILES[key] || '';
    }

    // 起動時に全ムービーを先読み
    function warmUpVideos() {
      ['intro', 'kinuso', 'kinkan'].forEach(key => {
        try {
          const url = videoUrl(key);
          if (!url) return;
          const v = document.createElement('video');
          v.preload = 'auto';
          v.muted = true;
          v.playsInline = true;
          v.setAttribute('playsinline', '');
          v.src = url;
        } catch (e) {}
      });
    }
    // DOM 準備後に実行
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', warmUpVideos);
    } else {
      warmUpVideos();
    }


    const BGM_URL = 'bgm.m4a';

    const RESULT_IMG = {
      correct: 'result-correct.jpg',
      wrong:   'result-wrong.jpg'
    };


    // ===== BGM =====
    let bgmMuted = false;
    let bgmStarted = false;

    function initBgm() {
      const a = $('bgm');
      if (!a) return;
      a.src = BGM_URL;
      a.volume = 0.35;
      a.loop = true;
    }

    function startBgm() {
      const a = $('bgm');
      if (!a || bgmMuted) return;
      const p = a.play();
      if (p && p.catch) p.catch(function(){});
      bgmStarted = true;
    }

    function pauseBgm() {
      const a = $('bgm');
      if (a && !a.paused) a.pause();
    }

    function resumeBgm() {
      if (bgmMuted || !bgmStarted) return;
      const a = $('bgm');
      if (!a) return;
      const p = a.play();
      if (p && p.catch) p.catch(function(){});
    }

    function toggleBgm() {
      bgmMuted = !bgmMuted;
      const a = $('bgm');
      const btn = $('btnMute');
      if (bgmMuted) {
        if (a) a.pause();
        if (btn) btn.textContent = 'OFF';
      } else {
        if (btn) btn.textContent = 'BGM';
        if (bgmStarted) startBgm();
      }
    }

    // ===== State =====
    let players = ['プレイヤー1', 'プレイヤー2'];
    let scores = [0, 0];
    let streak = 0;
    let speakerIdx = 0;      // who inputs the statement
    let guesserIdx = 1;      // who guesses
    let currentStatement = '';
    let isTruth = null;      // true = truth, false = lie
    let lastGuessCorrect = false;
    let selectedTruth = null;

    // ===== Helpers =====
    function $(id) { return document.getElementById(id); }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      $(id).classList.add('active');
    }

    function updateScoreBar() {
      $('p1Label').textContent = players[0];
      $('p2Label').textContent = players[1];
      $('p1Points').textContent = scores[0];
      $('p2Points').textContent = scores[1];
      $('streak').textContent = streak;

      $('p1Score').classList.toggle('active', speakerIdx === 0 || guesserIdx === 0);
      $('p2Score').classList.toggle('active', speakerIdx === 1 || guesserIdx === 1);
    }

    // ===== Start =====
    function startGame() {
      const n1 = $('name1').value.trim() || 'プレイヤー1';
      const n2 = $('name2').value.trim() || 'プレイヤー2';
      players = [n1, n2];
      scores = [0, 0];
      streak = 0;
      speakerIdx = 0;
      guesserIdx = 1;
      $('scoreBar').style.display = 'flex';
      $('btnTop').classList.add('show');
      $('btnMute').classList.add('show');
      updateScoreBar();
      startBgm();
      goToPassForSpeaker();
    }

    function goToTop() {
      // 再生中なら止める
      try { stopVideo(); } catch (e) {}
      const ov = $('overlay');
      if (ov) ov.classList.remove('active');
      // 状態リセット（名前入力は残す）
      scores = [0, 0];
      streak = 0;
      speakerIdx = 0;
      guesserIdx = 1;
      currentStatement = '';
      isTruth = null;
      lastGuessCorrect = false;
      selectedTruth = null;
      $('scoreBar').style.display = 'none';
      $('btnTop').classList.remove('show');
      $('btnMute').classList.remove('show');
      pauseBgm();
      bgmStarted = false;
      updateScoreBar();
      showScreen('screen-start');
    }

    function goToPassForSpeaker() {
      $('passToName').textContent = players[speakerIdx];
      $('passRoleText').innerHTML = `あなたは<strong style="color:var(--gold)">発言者</strong>です`;
      showScreen('screen-pass');
    }

    function confirmPass() {
      // Speaker confirmed → input screen
      $('inputPlayerName').textContent = players[speakerIdx];
      $('statementInput').value = '';
      selectedTruth = null;
      $('btnTruth').classList.remove('selected-truth');
      $('btnLie').classList.remove('selected-lie');
      $('btnSend').disabled = true;
      showScreen('screen-input');
    }

    function setTruth(val) {
      selectedTruth = val;
      $('btnTruth').classList.toggle('selected-truth', val === true);
      $('btnLie').classList.toggle('selected-lie', val === false);
      checkSendReady();
    }

    function checkSendReady() {
      const text = $('statementInput').value.trim();
      $('btnSend').disabled = !(text.length > 0 && selectedTruth !== null);
    }

    $('statementInput').addEventListener('input', checkSendReady);

    function sendStatement() {
      currentStatement = $('statementInput').value.trim();
      isTruth = selectedTruth;
      if (!currentStatement || isTruth === null) return;

      // Pass to guesser
      $('passGuesserName').textContent = players[guesserIdx];
      showScreen('screen-pass-guesser');
    }

    // ===== Movie helper (single persistent <video>, so iOS keeps sound unlocked) =====
    let seqTimer = null;
    let cdTimer = null;
    let resultTimer = null;
    let overlayMode = 'result'; // 'intro' | 'result'

    let cdWatch = null;
    function stopCountdownWatch() {
      clearInterval(cdWatch);
      cdWatch = null;
      const cd = $('countdown');
      cd.classList.remove('show', 'pop');
      cd.textContent = '';
    }

    // 『金だ！』パートが終わる(join)3秒前から、動画の下に 3 → 2 → 1 を出す
    function startCountdownWatch(join) {
      stopCountdownWatch();
      const mv = $('mv');
      const cd = $('countdown');
      let shown = null;
      cdWatch = setInterval(() => {
        const remain = join - mv.currentTime;
        if (remain <= 0) { stopCountdownWatch(); return; } // 次のムービーに入ったら消す
        if (remain <= 3) {
          const n = Math.ceil(remain);
          if (n !== shown) {
            shown = n;
            cd.textContent = n;
            cd.classList.add('show');
            cd.classList.remove('pop');
            void cd.offsetWidth; // restart animation
            cd.classList.add('pop');
          }
        }
      }, 40);
    }

    function ensureInlineVideo(mv) {
      // Force inline playback on every play (iOS / Android / WebView)
      mv.setAttribute('playsinline', '');
      mv.setAttribute('webkit-playsinline', '');
      mv.setAttribute('x5-playsinline', '');
      mv.setAttribute('x5-video-player-type', 'h5');
      mv.setAttribute('x5-video-player-fullscreen', 'false');
      mv.setAttribute('controlsList', 'nodownload nofullscreen noremoteplayback');
      mv.disablePictureInPicture = true;
      mv.playsInline = true;
      // If the OS still tries to go fullscreen, exit immediately
      const exitFs = () => {
        try {
          if (document.webkitFullscreenElement === mv || document.fullscreenElement === mv) {
            (document.webkitExitFullscreen || document.exitFullscreen || (() => {})).call(document);
          }
          if (mv.webkitDisplayingFullscreen) {
            mv.webkitExitFullscreen && mv.webkitExitFullscreen();
          }
        } catch (e) {}
      };
      mv.removeEventListener('webkitbeginfullscreen', exitFs);
      mv.removeEventListener('beginfullscreen', exitFs);
      mv.addEventListener('webkitbeginfullscreen', exitFs);
      mv.addEventListener('beginfullscreen', exitFs);
    }

    function stopVideo() {
      stopCountdownWatch();
      clearTimeout(seqTimer);
      clearTimeout(cdTimer);
      clearTimeout(resultTimer);
      const mv = $('mv');
      mv.onended = null;
      mv.onerror = null;
      mv.onloadeddata = null;
      mv.pause();
      mv.classList.remove('show');
      $('countdown').classList.remove('show', 'pop');
      $('countdown').textContent = '';
    }

    // keys を順に連続再生し、全部終わる(またはエラー)と onEnd を呼ぶ
    // ソース切替時の黒画面を減らすため、次クリップを先読みしてから切替える
    function playSequence(keys, onEnd, safetyMs, onClip) {
      pauseBgm();
      const mv = $('mv');
      ensureInlineVideo(mv);
      let qi = 0;
      let finished = false;
      const finish = () => {
        if (finished) return;
        finished = true;
        mv.onended = null;
        mv.onerror = null;
        mv.onloadeddata = null;
        clearTimeout(seqTimer);
        onEnd();
      };
      const playNow = () => {
        ensureInlineVideo(mv);
        const q = mv.play();
        if (q && q.catch) q.catch(() => {
          // 音声ロック時はミュートで続行（サイレントでも流れを止めない）
          mv.muted = true;
          mv.play().catch(finish);
        });
      };
      const loadAndPlay = (idx) => {
        ensureInlineVideo(mv);
        mv.muted = false;
        mv.src = videoUrl(keys[idx]);
        mv.classList.add('show');
        // ロード完了を待ってから再生 → 切替時の一瞬の黒/つぎはぎ感を軽減
        const start = () => {
          mv.onloadeddata = null;
          if (onClip) onClip(idx);
          playNow();
        };
        if (mv.readyState >= 2) {
          start();
        } else {
          mv.onloadeddata = start;
          // 万一 loadeddata が来ない場合の保険
          setTimeout(() => { if (mv.onloadeddata) start(); }, 400);
        }
      };
      mv.onended = () => {
        if (++qi < keys.length) {
          loadAndPlay(qi);
        } else {
          finish();
        }
      };
      mv.onerror = finish;
      loadAndPlay(0);
      // Safety net in case 'ended' never fires
      clearTimeout(seqTimer);
      seqTimer = setTimeout(finish, safetyMs);
    }

    // ===== Intro (冒頭) → 選択画面 =====
    function showGuessScreen() {
      $('guesserName').textContent = players[guesserIdx];
      $('statementDisplay').textContent = currentStatement;

      // 冒頭ムービーを流してから選択画面(嘘か本当か)を出す
      overlayMode = 'intro';
      $('resultText').className = 'result-text';
      $('resultText').textContent = '';
      $('resultSub').textContent = '';
      $('btnNext').textContent = 'スキップ';
      const _iw = $('resultImgWrap'); if (_iw) { _iw.classList.remove('show'); $('resultImg').removeAttribute('src'); }
      $('overlay').classList.remove('result-mode'); $('overlay').classList.add('active');
      playSequence(['intro'], endIntro, 20000);
    }

    function endIntro() {
      if (overlayMode !== 'intro' || !$('overlay').classList.contains('active')) return;
      stopVideo();
      $('overlay').classList.remove('active', 'result-mode');
      resumeBgm();
      showScreen('screen-guess');
    }

    // ===== Guess =====
    function revealResult() {
      clearTimeout(resultTimer);
      clearTimeout(cdTimer);
      const resultText = $('resultText');
      const resultSub = $('resultSub');
      if (resultText.textContent) return; // already shown
      // 動画を止めて隠し、結果画像を画面中央に出す
      stopVideo();
      $('overlay').classList.add('result-mode');
      $('countdown').classList.remove('show', 'pop');
      $('btnNext').textContent = '次へ';
      const imgWrap = $('resultImgWrap');
      const img = $('resultImg');
      if (lastGuessCorrect) {
        resultText.textContent = '正解！';
        resultText.classList.add('correct');
        resultSub.textContent = isTruth
          ? '本当だった！見抜いたね'
          : '嘘だった！見抜けた！';
        img.src = RESULT_IMG.correct;
        img.alt = '正解';
      } else {
        resultText.textContent = '不正解…';
        resultText.classList.add('wrong');
        resultSub.textContent = isTruth
          ? '本当だったのに…'
          : '嘘だったのに…';
        img.src = RESULT_IMG.wrong;
        img.alt = '不正解';
      }
      imgWrap.classList.add('show');
      resumeBgm();
    }

    function makeGuess(guessIsTruth) {
      // guessIsTruth: true = pressed "本当", false = pressed "嘘"
      lastGuessCorrect = (guessIsTruth === isTruth);

      overlayMode = 'result';
      $('resultText').className = 'result-text';
      $('resultText').textContent = '';
      $('resultSub').textContent = '';
      $('btnNext').textContent = 'スキップ';
      const _iw = $('resultImgWrap'); if (_iw) { _iw.classList.remove('show'); $('resultImg').removeAttribute('src'); }
      stopVideo();

      // Score is settled immediately (so skipping can never change it)
      if (lastGuessCorrect) {
        scores[guesserIdx]++;
        streak++;
      } else {
        streak = 0;
      }
      updateScoreBar();

      // 『金だ！』→結果ムービー は1本に編集済み(つなぎ目なし)。
      // 『金だ！』パートの終了3秒前から数字が動画の下に出る。
      // 結果ムービーは実際の答えで決まる:
      //   嘘が正解(嘘にして正解 / 本当にして不正解) → 『私に嘘はつかないでぇええ』
      //   本当が正解(本当にして正解 / 嘘にして不正解) → 『勘違いするなよ』
      const seq = isTruth ? SEQ.kanchigai : SEQ.uso;

      $('overlay').classList.remove('result-mode'); $('overlay').classList.add('active');
      playSequence([seq.key], revealResult, 40000, () => startCountdownWatch(seq.join));
    }

    function afterResult() {
      if (overlayMode === 'intro') { endIntro(); return; }

      // カウントダウン/ムービー中に押したら、結果表示までスキップ
      if (!$('resultText').textContent) {
        stopVideo();
        revealResult();
        return;
      }

      stopVideo();
      $('overlay').classList.remove('active', 'result-mode');
      const _iw = $('resultImgWrap');
      if (_iw) { _iw.classList.remove('show'); $('resultImg').removeAttribute('src'); }

      if (lastGuessCorrect) {
        // Same roles continue: speaker stays, guesser stays
        goToPassForSpeaker();
      } else {
        // Switch roles
        const tmp = speakerIdx;
        speakerIdx = guesserIdx;
        guesserIdx = tmp;
        updateScoreBar();
        goToPassForSpeaker();
      }
    }

    initBgm();
    showScreen('screen-start');
  </script>
</body>
</html>
